<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dumpling House - Grand Line Dash</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap');
        
        body {
            margin: 0; padding: 0;
            background-color: #0f172a;
            font-family: 'Nunito', sans-serif;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; overflow: hidden; user-select: none;
        }
        #game-app {
            width: 100%; max-width: 420px; height: 100vh;
            background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
            display: flex; flex-direction: column;
            position: relative; box-shadow: 0 0 30px rgba(0,0,0,0.9);
        }

        /* Top HUD */
        #hud {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 20px; background: rgba(0,0,0,0.4);
            border-bottom: 2px solid #334155; color: #fff;
        }
        .hud-item { display: flex; flex-direction: column; }
        .hud-title { font-size: 12px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }
        .hud-value { font-size: 20px; color: #fbbf24; font-weight: 900; }
        #lives { color: #ef4444; font-size: 18px; letter-spacing: 2px; }

        /* Restaurant Area */
        #restaurant {
            flex: 1; position: relative;
            display: flex; justify-content: space-evenly; align-items: flex-end;
            padding-bottom: 20px;
            background: radial-gradient(circle at 50% 30%, #334155, transparent);
        }
        .counter-top {
            position: absolute; bottom: 0; width: 100%; height: 80px;
            background: linear-gradient(90deg, #451a03, #78350f, #451a03);
            border-top: 6px solid #b45309; box-shadow: 0 -10px 20px rgba(0,0,0,0.5);
            z-index: 1;
        }

        /* Customer Seats */
        .seat {
            width: 30%; height: 200px; position: relative;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
            z-index: 2;
        }
        
        .customer {
            display: flex; flex-direction: column; align-items: center;
            animation: slideUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .char-icon { font-size: 50px; filter: drop-shadow(0 10px 10px rgba(0,0,0,0.6)); }
        
        .order-bubble {
            background: #fff; color: #0f172a; font-size: 13px; font-weight: 900;
            padding: 8px 12px; border-radius: 12px; position: absolute;
            top: 10px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            animation: popIn 0.3s;
        }
        .order-bubble::after {
            content: ''; position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%);
            border-width: 6px 6px 0; border-style: solid; border-color: #fff transparent transparent transparent;
        }
        .order-emoji { font-size: 24px; display: block; margin-top: 2px; }

        /* Patience Bar */
        .patience-container {
            width: 100%; height: 8px; background: #334155;
            border-radius: 4px; margin-top: 10px; overflow: hidden;
            border: 2px solid #1e293b;
        }
        .patience-bar { height: 100%; width: 100%; background: #22c55e; transition: width 0.1s linear, background-color 0.3s; }

        /* Kitchen Area */
        #kitchen {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
            padding: 20px; background: #0f172a; z-index: 10;
            border-top: 2px solid #334155;
        }
        .kitchen-btn {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            border: none; border-radius: 16px; padding: 12px 5px;
            color: white; font-family: 'Nunito', sans-serif;
            font-size: 12px; font-weight: 900; cursor: pointer;
            box-shadow: 0 6px 0 #1d4ed8, 0 10px 15px rgba(0,0,0,0.4);
            display: flex; flex-direction: column; align-items: center;
            transition: all 0.1s;
        }
        .kitchen-btn:active { transform: translateY(6px); box-shadow: 0 0 0 #1d4ed8; }
        .kitchen-btn .food-icon { font-size: 32px; margin-bottom: 4px; }

        /* UI Screens */
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.9); z-index: 20;
            display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
        }
        .overlay h1 { color: #fbbf24; font-size: 36px; margin: 0 0 10px 0; text-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .overlay p { color: #cbd5e1; font-size: 16px; margin-bottom: 30px; padding: 0 20px; }
        .start-btn {
            background: #fbbf24; color: #78350f; border: none;
            padding: 15px 40px; font-size: 20px; font-weight: 900; font-family: 'Nunito', sans-serif;
            border-radius: 30px; box-shadow: 0 6px 0 #d97706; cursor: pointer; transition: transform 0.2s;
        }
        .start-btn:hover { transform: scale(1.05); }

        .floating-text {
            position: absolute; font-size: 24px; font-weight: 900; z-index: 15;
            animation: floatUp 0.8s forwards; pointer-events: none;
        }

        /* Animations */
        @keyframes slideUp { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes popIn { from { transform: scale(0); } to { transform: scale(1); } }
        @keyframes floatUp { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(-50px); opacity: 0; } }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="game-app">
    <div id="hud">
        <div class="hud-item">
            <span class="hud-title">Score</span>
            <span class="hud-value" id="score">0</span>
        </div>
        <div class="hud-item" style="align-items: center;">
            <span class="hud-title">Lives</span>
            <span class="hud-value" id="lives">❤️❤️❤️</span>
        </div>
        <div class="hud-item" style="align-items: flex-end;">
            <span class="hud-title">Combo</span>
            <span class="hud-value" style="color: #38bdf8;">x<span id="combo">1</span></span>
        </div>
    </div>
    
    <div id="restaurant">
        <div class="counter-top"></div>
        <div class="seat" id="seat-0"></div>
        <div class="seat" id="seat-1"></div>
        <div class="seat" id="seat-2"></div>
    </div>

    <div id="kitchen">
        <button class="kitchen-btn" onclick="serveFood('Pork Dumpling')"><span class="food-icon">🥟</span>Pork Dumpling</button>
        <button class="kitchen-btn" onclick="serveFood('Veggie Gyoza')"><span class="food-icon">🥬</span>Veggie Gyoza</button>
        <button class="kitchen-btn" onclick="serveFood('Spicy Shrimp')"><span class="food-icon">🦐</span>Spicy Shrimp</button>
        <button class="kitchen-btn" onclick="serveFood('Sweet Bao')"><span class="food-icon">🥠</span>Sweet Bao</button>
        <button class="kitchen-btn" onclick="serveFood('Kibi Dango')"><span class="food-icon">🍡</span>Kibi Dango</button>
        <button class="kitchen-btn" onclick="serveFood('Sea King Gyoza')"><span class="food-icon">🌊</span>Sea King Gyoza</button>
    </div>

    <div class="overlay" id="start-screen">
        <h1>Dumpling Dash</h1>
        <p>Serve the Grand Line crew before they lose patience!<br>Don't run out of lives.</p>
        <button class="start-btn" onclick="startGame()">PLAY NOW</button>
    </div>

    <div class="overlay hidden" id="game-over-screen">
        <h1>Game Over</h1>
        <p>Final Score: <span id="final-score" style="color:white; font-size:24px; font-weight:bold;">0</span></p>
        <button class="start-btn" onclick="startGame()">TRY AGAIN</button>
    </div>
</div>

<script>
    const foods = [
        { id: "Pork Dumpling", icon: "🥟" }, { id: "Veggie Gyoza", icon: "🥬" },
        { id: "Spicy Shrimp", icon: "🦐" }, { id: "Sweet Bao", icon: "🥠" },
        { id: "Kibi Dango", icon: "🍡" }, { id: "Sea King Gyoza", icon: "🌊" }
    ];
    const chars = ["👒", "⚔️", "🍳", "🍊", "🦌", "🦈"];
    
    let state = {
        score: 0, lives: 3, combo: 1, isPlaying: false,
        spawnRate: 3000, // Ms between spawns
        customers: [null, null, null] // 3 seats
    };
    
    let gameLoop;
    let spawnTimer;

    function startGame() {
        state = { score: 0, lives: 3, combo: 1, isPlaying: true, spawnRate: 3000, customers: [null, null, null] };
        document.getElementById("seat-0").innerHTML = "";
        document.getElementById("seat-1").innerHTML = "";
        document.getElementById("seat-2").innerHTML = "";
        
        updateHUD();
        document.getElementById("start-screen").classList.add("hidden");
        document.getElementById("game-over-screen").classList.add("hidden");
        
        gameLoop = setInterval(updateLogic, 100);
        scheduleSpawn();
    }

    function scheduleSpawn() {
        if (!state.isPlaying) return;
        spawnTimer = setTimeout(() => {
            spawnCustomer();
            // Yavaş yavaş zorluğu arttır (minimum 1 saniyeye kadar düşer)
            if(state.spawnRate > 1000) state.spawnRate -= 50; 
            scheduleSpawn();
        }, Math.random() * 1000 + state.spawnRate);
    }

    function spawnCustomer() {
        let emptySeats = state.customers.map((c, i) => c === null ? i : -1).filter(i => i !== -1);
        if (emptySeats.length === 0) return; // Masa dolu
        
        let seatIdx = emptySeats[Math.floor(Math.random() * emptySeats.length)];
        let food = foods[Math.floor(Math.random() * foods.length)];
        let char = chars[Math.floor(Math.random() * chars.length)];
        
        // Müşteri objesi
        let patienceMax = 100;
        state.customers[seatIdx] = {
            foodId: food.id, char: char, patience: patienceMax, maxPatience: patienceMax
        };
        renderSeat(seatIdx);
    }

    function updateLogic() {
        if(!state.isPlaying) return;
        
        for (let i = 0; i < 3; i++) {
            let cust = state.customers[i];
            if (cust) {
                // Sabır süresi azalır
                cust.patience -= 0.6; 
                
                if (cust.patience <= 0) {
                    // Sabrı taştı ve kaçtı
                    customerLeaves(i, false);
                } else {
                    updatePatienceUI(i);
                }
            }
        }
    }

    function serveFood(foodId) {
        if (!state.isPlaying) return;
        
        // Doğru yemeği isteyen ve en çok bekleyen müşteriyi bul
        let targetIdx = -1;
        let lowestPatience = 999;
        
        for (let i = 0; i < 3; i++) {
            let cust = state.customers[i];
            if (cust && cust.foodId === foodId) {
                if (cust.patience < lowestPatience) {
                    lowestPatience = cust.patience;
                    targetIdx = i;
                }
            }
        }

        if (targetIdx !== -1) {
            // Doğru Sipariş
            let pts = 10 * state.combo;
            state.score += pts;
            state.combo++;
            showFloatingText("+" + pts, "#22c55e", targetIdx);
            customerLeaves(targetIdx, true);
        } else {
            // Yanlış Sipariş
            state.combo = 1;
            loseLife();
            // Tüm masalarda ekranı sars
            document.getElementById("restaurant").style.transform = "translateX(5px)";
            setTimeout(() => document.getElementById("restaurant").style.transform = "none", 100);
        }
        updateHUD();
    }

    function customerLeaves(seatIdx, isHappy) {
        if (!isHappy) {
            state.combo = 1;
            showFloatingText("Angry!", "#ef4444", seatIdx);
            loseLife();
        }
        state.customers[seatIdx] = null;
        let seatEl = document.getElementById("seat-" + seatIdx);
        seatEl.innerHTML = ""; // Müşteriyi kaldır
        updateHUD();
    }

    function loseLife() {
        state.lives--;
        if (state.lives <= 0) {
            endGame();
        }
    }

    function updatePatienceUI(seatIdx) {
        let cust = state.customers[seatIdx];
        if(!cust) return;
        let bar = document.getElementById("bar-" + seatIdx);
        if(bar) {
            let pct = (cust.patience / cust.maxPatience) * 100;
            bar.style.width = pct + "%";
            if(pct < 30) bar.style.backgroundColor = "#ef4444"; // Kırmızı
            else if(pct < 60) bar.style.backgroundColor = "#eab308"; // Sarı
        }
    }

    function renderSeat(seatIdx) {
        let cust = state.customers[seatIdx];
        let seatEl = document.getElementById("seat-" + seatIdx);
        let foodIcon = foods.find(f => f.id === cust.foodId).icon;
        
        seatEl.innerHTML = `
            <div class="customer">
                <div class="order-bubble">
                    ${cust.foodId} <span class="order-emoji">${foodIcon}</span>
                </div>
                <div class="char-icon">${cust.char}</div>
                <div class="patience-container">
                    <div class="patience-bar" id="bar-${seatIdx}"></div>
                </div>
            </div>
        `;
    }

    function showFloatingText(text, color, seatIdx) {
        let seatEl = document.getElementById("seat-" + seatIdx);
        let floatEl = document.createElement("div");
        floatEl.textContent = text;
        floatEl.className = "floating-text";
        floatEl.style.color = color;
        floatEl.style.top = "20%";
        seatEl.appendChild(floatEl);
        setTimeout(() => floatEl.remove(), 800);
    }

    function updateHUD() {
        document.getElementById("score").textContent = state.score;
        document.getElementById("combo").textContent = state.combo;
        let hearts = "";
        for(let i=0; i<state.lives; i++) hearts += "❤️";
        document.getElementById("lives").textContent = hearts || "💀";
    }

    function endGame() {
        state.isPlaying = false;
        clearInterval(gameLoop);
        clearTimeout(spawnTimer);
        document.getElementById("final-score").textContent = state.score;
        document.getElementById("game-over-screen").classList.remove("hidden");
    }
</script>
</body>
</html>
