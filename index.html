<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dumpling House Deluxe</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #111;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }
        #game-container {
            width: 100%;
            max-width: 400px;
            height: 100vh;
            background: radial-gradient(circle at top, #d32f2f, #700000);
            position: relative;
            color: white;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        
        /* Thematic Decorations */
        .lantern {
            font-size: 45px;
            position: absolute;
            top: -5px;
            animation: swing 3s infinite ease-in-out alternate;
            transform-origin: top center;
            filter: drop-shadow(0 0 15px rgba(255,215,0,0.6));
            z-index: 5;
        }
        .lantern.left { left: 20px; animation-delay: 0s; }
        .lantern.right { right: 20px; animation-delay: 1.5s; }
        @keyframes swing {
            0% { transform: rotate(-12deg); }
            100% { transform: rotate(12deg); }
        }

        /* Top HUD */
        #header {
            display: flex;
            justify-content: space-between;
            padding: 15px 20px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.5);
            border-bottom: 2px solid #ffd700;
        }
        .stat { font-size: 18px; font-weight: bold; color: #ffd700; }
        #combo-display { color: #ff9800; font-size: 14px; margin-top: 5px; }

        /* Main Game Area */
        #customer-area {
            flex: 1;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: 10px;
        }
        .table-counter {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 25%;
            background: linear-gradient(#8b5a2b, #4a2e15);
            border-top: 6px solid #a0522d;
            box-shadow: inset 0 10px 20px rgba(0,0,0,0.5);
            z-index: 1;
        }

        #character {
            font-size: 110px;
            z-index: 2;
            transition: transform 0.3s;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.6));
            margin-bottom: 10%;
        }

        #order-bubble {
            background: #fff8dc;
            color: #8b0000;
            padding: 12px 20px;
            border-radius: 15px;
            border: 2px solid #ffd700;
            font-size: 18px;
            font-weight: bold;
            position: absolute;
            top: 15%;
            text-align: center;
            z-index: 3;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #order-bubble::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            margin-left: -10px;
            border-width: 10px 10px 0;
            border-style: solid;
            border-color: #fff8dc transparent transparent transparent;
        }

        /* Kitchen Controls */
        #kitchen {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            padding: 20px;
            background: #1a1a1a;
            z-index: 10;
            border-top: 3px solid #ffd700;
        }
        .recipe-btn {
            background: linear-gradient(#ffb74d, #f57c00);
            border: 2px solid #e65100;
            color: #4e1a00;
            border-radius: 12px;
            padding: 10px;
            font-size: 15px;
            font-weight: 900;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 6px 0 #c63f00;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .recipe-btn:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 #c63f00;
        }
        .recipe-btn span { font-size: 32px; margin-bottom: 5px; }

        /* UI Screens (Start / Game Over) */
        #ui-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 20;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        #ui-screen h1 { color: #ffd700; font-size: 38px; margin-bottom: 5px; letter-spacing: 2px; text-transform: uppercase; }
        #ui-screen p { font-size: 20px; color: #fff; margin-bottom: 25px; padding: 0 20px; }
        .action-btn {
            background: #4caf50;
            border: none;
            padding: 15px 40px;
            color: white;
            font-size: 22px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(76,175,80,0.5);
            transition: transform 0.2s;
        }
        .action-btn:hover { transform: scale(1.05); }

        /* Animations */
        @keyframes popIn { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        @keyframes floatUp { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(-60px); opacity: 0; } }
        
        .floating-text {
            position: absolute;
            font-size: 26px;
            font-weight: bold;
            z-index: 15;
            pointer-events: none;
            animation: floatUp 0.8s forwards;
            top: 40%;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="game-container">
    <div class="lantern left">🏮</div>
    <div class="lantern right">🏮</div>

    <div id="header">
        <div>
            <div class="stat">Time: <span id="timer">60</span>s</div>
            <div id="combo-display">Combo: x<span id="combo">1</span></div>
        </div>
        <div class="stat">Score: <span id="score">0</span></div>
    </div>
    
    <div id="customer-area">
        <div class="table-counter"></div>
        <div id="order-bubble" class="hidden">I'd like some<br><span id="current-order" style="color:#d32f2f; font-size:22px;"></span></div>
        <div id="character" class="hidden">👲</div>
    </div>

    <div id="kitchen">
        <button class="recipe-btn" onclick="serveFood('Pork Dumpling')">
            <span>🥟</span> Pork Dumpling
        </button>
        <button class="recipe-btn" onclick="serveFood('Veggie Gyoza')">
            <span>🥬</span> Veggie Gyoza
        </button>
        <button class="recipe-btn" onclick="serveFood('Spicy Shrimp')">
            <span>🦐</span> Spicy Shrimp
        </button>
        <button class="recipe-btn" onclick="serveFood('Sweet Bao')">
            <span>🥠</span> Sweet Bao
        </button>
    </div>

    <div id="ui-screen">
        <h1 id="screen-title">Dumpling House</h1>
        <p id="screen-desc">Serve correct meals quickly to build your combo multiplier!</p>
        <button class="action-btn" id="start-btn" onclick="startGame()">START GAME</button>
    </div>
</div>

<script>
    let score = 0;
    let timeLeft = 60;
    let combo = 1;
    let currentRecipe = "";
    let gameInterval;
    let isPlaying = false;
    
    const recipes = ["Pork Dumpling", "Veggie Gyoza", "Spicy Shrimp", "Sweet Bao"];
    const characters = ["👲", "👵", "👨‍💼", "👩‍🎓", "🧛", "🥷"];
    
    const characterEl = document.getElementById("character");
    const orderBubble = document.getElementById("order-bubble");
    const orderEl = document.getElementById("current-order");
    const scoreEl = document.getElementById("score");
    const timerEl = document.getElementById("timer");
    const comboEl = document.getElementById("combo");
    const uiScreen = document.getElementById("ui-screen");
    const customerArea = document.getElementById("customer-area");

    function startGame() {
        score = 0;
        timeLeft = 60;
        combo = 1;
        isPlaying = true;
        
        updateHUD();
        uiScreen.classList.add("hidden");
        characterEl.classList.remove("hidden");
        orderBubble.classList.remove("hidden");
        
        spawnCustomer();
        gameInterval = setInterval(updateTimer, 1000);
    }

    function updateTimer() {
        timeLeft--;
        timerEl.textContent = timeLeft;
        
        if (timeLeft <= 10) { timerEl.style.color = "#ff4444"; }
        else { timerEl.style.color = "#ffd700"; }
        
        if (timeLeft <= 0) { endGame(); }
    }

    function spawnCustomer() {
        if (!isPlaying) return;
        
        // Remove old animation to trigger it again
        orderBubble.style.animation = 'none';
        orderBubble.offsetHeight; /* trigger reflow */
        orderBubble.style.animation = null; 

        const randomChar = characters[Math.floor(Math.random() * characters.length)];
        currentRecipe = recipes[Math.floor(Math.random() * recipes.length)];
        
        characterEl.textContent = randomChar;
        orderEl.textContent = currentRecipe;
        characterEl.style.transform = "scale(1)";
    }

    function serveFood(foodName) {
        if (!isPlaying) return;

        if (foodName === currentRecipe) {
            let pointsEarned = 10 * combo;
            score += pointsEarned;
            combo++;
            showFloatingText("+" + pointsEarned, "#4caf50");
            characterEl.style.transform = "scale(1.2)"; // Happy jump
            setTimeout(spawnCustomer, 300);
        } else {
            score -= 5;
            combo = 1; // Reset combo on mistake
            showFloatingText("-5", "#f44336");
            characterEl.style.transform = "translateX(20px)"; // Angry shake
            setTimeout(() => characterEl.style.transform = "translateX(0)", 150);
        }
        updateHUD();
    }

    function showFloatingText(text, color) {
        const floatEl = document.createElement("div");
        floatEl.textContent = text;
        floatEl.className = "floating-text";
        floatEl.style.color = color;
        customerArea.appendChild(floatEl);
        
        setTimeout(() => { floatEl.remove(); }, 800);
    }

    function updateHUD() {
        scoreEl.textContent = score;
        comboEl.textContent = combo;
    }

    function endGame() {
        isPlaying = false;
        clearInterval(gameInterval);
        
        characterEl.classList.add("hidden");
        orderBubble.classList.add("hidden");
        
        document.getElementById("screen-title").textContent = "Time's Up!";
        document.getElementById("screen-desc").textContent = "Final Score: " + score;
        document.getElementById("start-btn").textContent = "PLAY AGAIN";
        uiScreen.classList.remove("hidden");
    }
</script>

</body>
</html>
