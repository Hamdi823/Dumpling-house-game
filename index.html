<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dumpling Master: Baratie Edition</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&display=swap');
        
        * { box-sizing: border-box; }
        
        body {
            margin: 0; padding: 0; 
            background-color: #2c3e50; 
            font-family: 'Poppins', sans-serif;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; overflow: hidden; user-select: none;
            color: #fff;
        }
        
        #game-container {
            width: 100%; max-width: 400px; height: 100vh;
            position: relative; display: flex; flex-direction: column;
            background-color: #000;
            box-shadow: 0 0 30px rgba(0,0,0,0.9); overflow: hidden;
            border: 2px solid #34495e;
        }

        #ocean-view { position: absolute; top: 0; left: 0; width: 100%; height: 40%; background: linear-gradient(180deg, #4facfe 0%, #00f2fe 100%); z-index: 0; }
        .sun { position: absolute; top: 15%; right: 15%; width: 55px; height: 55px; background: #ffd700; border-radius: 50%; box-shadow: 0 0 30px #ffd700; }
        #ship-deck { position: absolute; top: 40%; left: 0; width: 100%; height: 60%; background: #5c3a21; z-index: 0; border-top: 12px solid #27150c; box-shadow: inset 0 20px 20px rgba(0,0,0,0.5); }

        #hud { display: flex; justify-content: space-between; padding: 12px 20px; background: rgba(39, 21, 12, 0.9); border-bottom: 3px solid #f1c40f; z-index: 10; position: relative; }
        .stat-box { display: flex; flex-direction: column; align-items: center; }
        .stat-label { font-size: 11px; color: #d4a373; text-transform: uppercase; font-weight: bold; }
        .stat-value { font-size: 18px; font-weight: 900; color: #f1c40f; }

        #order-zone { padding: 15px; display: flex; align-items: center; justify-content: center; z-index: 10; position: relative; margin: 10px; background: rgba(255, 255, 255, 0.95); border-radius: 12px; border: 2px solid #f1c40f; box-shadow: 0 10px 20px rgba(0,0,0,0.4); }
        .customer-avatar { font-size: 45px; margin-right: 15px; filter: drop-shadow(0 5px 5px rgba(0,0,0,0.5)); }
        .order-details { color: #2c3e50; font-weight: 700; }
        #recipe-hint { font-size: 12px; color: #c0392b; margin-top: 5px; font-weight: 900; }

        #prep-zone { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; z-index: 10; }
        #plate { width: 150px; height: 150px; background: radial-gradient(circle, #fdfbfb 0%, #ebedee 100%); border-radius: 50%; border: 6px solid #b2bec3; display: flex; justify-content: center; align-items: center; box-shadow: 0 15px 25px rgba(0,0,0,0.6); font-size: 60px; position: relative; transition: all 0.3s; z-index: 10; }
        .plate-item { position: absolute; }
        .status-badge { position: absolute; bottom: -15px; background: #d35400; color: #fff; font-size: 12px; padding: 6px 18px; border-radius: 20px; font-weight: 900; box-shadow: 0 6px 10px rgba(0,0,0,0.5); border: 2px solid #e67e22; }

        #kitchen-station { background: #1a0e08; padding: 15px; border-top: 4px solid #f1c40f; display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; z-index: 10; position: relative; }
        .btn-group-title { grid-column: span 4; font-size: 11px; color: #d4a373; text-transform: uppercase; text-align: center; margin-bottom: -5px; margin-top: 5px; }
        .craft-btn { background: linear-gradient(145deg, #3e2723, #27150c); border: 2px solid #5c3a21; border-radius: 10px; color: #ecf0f1; font-size: 24px; padding: 10px 0; display: flex; flex-direction: column; align-items: center; cursor: pointer; transition: 0.1s; box-shadow: 0 4px 0 #1a0e08; font-family: 'Poppins', sans-serif; }
        .craft-btn span { font-size: 10px; font-weight: 700; margin-top: 5px; }
        .craft-btn:active { transform: translateY(4px); box-shadow: 0 0 0 #1a0e08; }
        .action-btn { background: linear-gradient(145deg, #c0392b, #922b21); border-color: #e74c3c; grid-column: span 2; box-shadow: 0 4px 0 #7b241c;}
        .action-btn:active { box-shadow: 0 0 0 #7b241c; }
        .serve-btn { background: linear-gradient(145deg, #27ae60, #1e8449); border-color: #2ecc71; grid-column: span 2; box-shadow: 0 4px 0 #196f3d;}
        .serve-btn:active { box-shadow: 0 0 0 #196f3d; }

        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(26, 14, 8, 0.95); z-index: 30; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        .overlay h1 { color: #f1c40f; font-size: 36px; margin: 0 0 5px 0; text-transform: uppercase; text-shadow: 0 5px 10px rgba(0,0,0,0.8); }
        .overlay h2 { color: #fff; font-size: 18px; margin: 0 0 20px 0; letter-spacing: 2px; }
        .overlay p { color: #ecf0f1; font-size: 14px; margin-bottom: 30px; padding: 15px; border-radius: 10px; border: 1px solid #5c3a21; background: rgba(0,0,0,0.5); }
        .start-btn { background: #f1c40f; color: #1a0e08; border: none; padding: 15px 40px; font-size: 20px; font-weight: 900; border-radius: 30px; cursor: pointer; box-shadow: 0 6px 0 #b7950b; font-family: 'Poppins', sans-serif; }
        .start-btn:active { transform: translateY(6px); box-shadow: 0 0 0 #b7950b; }

        /* INTRO SCENE STYLES */
        #intro-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 40; display: flex; flex-direction: column; justify-content: flex
